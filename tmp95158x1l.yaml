curriculum:
  enabled: true
  initial_stage: exploration
  stages:
    combat:
      reward_weights:
        combat: 4.0
        exploration: 0.5
        objective: 1.5
        survival: 0.2
      until_timestep: 600000
    completion:
      reward_weights:
        combat: 2.5
        exploration: 0.3
        objective: 3.0
        survival: 0.2
      until_timestep: 1000000
    exploration:
      reward_weights:
        combat: 1.5
        exploration: 2.0
        objective: 1.0
        survival: 0.4
      until_timestep: 200000
game_settings:
  capture_region:
    height: 1080
    left: 0
    top: 0
    width: 1920
  monitor_index: 2
  target_resolution:
  - 1920
  - 1080
  title: Resident Evil Agent
  window_mode: Borderless Windowed
  window_title_substring: RESIDENT EVIL 4
llm_settings:
  call_cooldown_seconds: 5.0
  claude_max_tokens: 600
  claude_model: claude-sonnet-4-6
  llm_every_n_steps: 60
  temperature: 0.5
perception:
  confidence_threshold: 0.4
  health_circle:
  - 880
  - 80
  - 980
  - 180
  health_colors:
    caution:
    - - 10
      - 50
      - 50
    - - 30
      - 255
      - 255
    danger:
    - - 0
      - 50
      - 50
    - - 10
      - 255
      - 255
    fine:
    - - 35
      - 50
      - 50
    - - 85
      - 255
      - 255
  health_smooth_window: 5
  ocr_regions:
    ammo:
    - 900
    - 1550
    - 980
    - 1900
  template_match_threshold: 0.85
  yolo_model: yolo11n.pt
reset:
  confirm_key: f
  confirm_wait: 0.5
  loading_wait: 8.0
  menu_open_wait: 1.5
  nav_between_wait: 0.4
  nav_down_count: 1
  select_wait: 1.0
rl_hyperparameters:
  action_hold_seconds: 0.08
  algorithm: RecurrentPPO
  batch_size: 128
  clip_range: 0.2
  ent_coef: 0.01
  features_dim: 512
  frame_stack: 4
  gae_lambda: 0.95
  gamma: 0.99
  grayscale: false
  learning_rate: 0.00025
  lstm_hidden_size: 256
  max_grad_norm: 0.5
  n_epochs: 4
  n_lstm_layers: 1
  n_steps: 512
  obs_frame_size:
  - 84
  - 84
  use_vec_normalize: true
simulation:
  ammo_pickup_amount: 10
  ammo_start_clip: 15
  ammo_start_reserve: 50
  dodge_cooldown: 8
  enemy_attack_cooldown: 15
  enemy_attack_damage: 12.0
  enemy_attack_range: 1.8
  enemy_chase_speed: 0.4
  enemy_detection_range: 14.0
  enemy_speed: 0.28
  enemy_waves: 3
  map_height: 50
  map_width: 50
  max_episode_steps: 600
  n_workers: 8
  player_speed: 0.6
  shoot_cone_deg: 18.0
  shoot_range: 20.0
  snapshot_every_n: 50
  sprint_multiplier: 1.8
  wave_trigger_kills: 5
storage:
  checkpoint_dir: models/checkpoints/
  db_path: data/re_agent_memory.db
  log_dir: logs/
  tensorboard_dir: logs/tensorboard/
training:
  checkpoint_freq: 50000
  eval_episodes: 3
  eval_freq: 10000
  resume_path: null
  total_timesteps: 600000
